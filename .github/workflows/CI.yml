name: CI

# Controls when the action will run. 
on: 
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'     
        required: false
        default: 'no'
  release:
    types: [published]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    name: build
    runs-on: ubuntu-22.04
    if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) }}
    env:
      build_variant: ${{ matrix.build_variant }}
      targets: ${{ matrix.targets }}
      images_dir: /opt/images
    strategy:
      matrix:
        include:
          - build_variant: "mt7620"
            targets: "PSG1208 PSG1218 NEWIFI-MINI MI-MINI MI-3 OYE-001 5K-W20"
          - build_variant: "mt7628"
            targets: "HC5861B MI-NANO MZ-R13 MZ-R13P 360P2 HC5761A HC5661A"
          - build_variant: "mt7621"
            targets: "K2P_nano K2P DIR-878 RM2100 CR660x"
          - build_variant: "mt7621-usb"
            targets: "XY-C1 JCG-836PRO JCG-AC860M JCG-Y2 DIR-882 A3004NS MSG1500 WR1200JS MI-R3G NEWIFI3 B70"
    steps:
      - uses: actions/checkout@v6
      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libtool-bin gperf python3-docutils autopoint gettext \
            fakeroot ca-certificates
      - name: Run shellcheck
        run: sh ./trunk/tools/shellcheck.sh
      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: toolchain-mipsel/toolchain-3.4.x
          key: ${{ runner.os }}-padavan-toolchain-3.4.x-${{ hashFiles('toolchain-mipsel/dl_toolchain.sh') }}
      - name: Prepare toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'yes' }}
        with:
          limit-access-to-actor: true
      - name: Start build
        run: |
          cd trunk
          mkdir -p ${images_dir}
          shopt -s nullglob
          kernel_ver="$(sed -n 's/^FIRMWARE_KERNEL_VER=\"\([^\"]*\)\"/\1/p' Makefile | head -n1)"
          [ -n "$kernel_ver" ] || kernel_ver="unknown"
          echo "kernel_ver=${kernel_ver}" >> $GITHUB_ENV
          collect_image() {
            local model="$1"
            local image
            local dst

            for image in images/*.trx; do
              dst="${images_dir}/Padavan-${model}-${kernel_ver}.trx"
              cp -f "$image" "$dst"
              echo "Collected $image -> $dst"
            done
          }
          for m in $targets; do
            fakeroot ./build_firmware_ci $m
            if [ $? = 0 ]; then
              collect_image "$m"
            else
              exit 1
            fi
            ./clear_tree_simple >/dev/null 2>&1
          done
      - name: Create archive
        if: ${{ github.event_name != 'release' && success() }}
        run: |
          ls -lh ${images_dir}
          GIT_VERSION=`git rev-parse --short=7 HEAD 2>/dev/null` && [ -n "$GIT_VERSION" ] && \
          image_name=Padavan-${build_variant}-${kernel_ver}-${GIT_VERSION} || image_name=Padavan-${build_variant}-${kernel_ver}
          cd ${images_dir}; md5sum *.trx |tee md5sum.txt; 7z a -mx=9 ${image_name}.7z ./*
          echo "image_name=${image_name}" >> $GITHUB_ENV
      - name: Upload images to Artifact
        if: ${{ github.event_name != 'release' && success() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.image_name }}
          path: ${{ env.images_dir }}/*.7z
      - name: Upload images to Releases
        if: ${{ github.event_name == 'release' && success() }}
        uses: svenstaro/upload-release-action@2.2.0
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ${{ env.images_dir }}/*.trx
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true

name: Build Firmware

on:
  push:
    branches:
      - master
      - main
      - performance-optimization
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Manual build mode'
        required: true
        default: 'single-target'
        type: choice
        options:
          - single-target
          - variant-batch
      target:
        description: 'Build target model'
        required: true
        default: 'PSG1218'
        type: choice
        options:
          - 360P2
          - 5K-W20
          - A3004NS
          - B70
          - CR660x
          - DIR-878
          - DIR-882
          - E8820V2
          - HC5661A
          - HC5761A
          - HC5861B
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q20
          - JCG-Y2
          - K2P
          - K2P_nano
          - K2P-USB
          - MI-3
          - MI-3C
          - MI-4
          - MI-MINI
          - MI-NANO
          - MI-R3G
          - MI-R3P
          - MI-R3P-breed
          - MI-R4A
          - MR2600
          - MSG1500
          - MZ-R13
          - MZ-R13P
          - NETGEAR-BZV
          - NETGEAR-CHJ
          - NEWIFI3
          - NEWIFI-MINI
          - OYE-001
          - PSG1208
          - PSG1218
          - PSG1218_nano
          - R2100
          - R6220
          - RM2100
          - RT-AC1200GU
          - WDR7300
          - WR1200JS
          - XY-C1
          - ZTE_E8820S
      variant:
        description: 'Batch build variant'
        required: true
        default: 'mt7621'
        type: choice
        options:
          - mt7620
          - mt7628
          - mt7621
          - mt7621-usb

env:
  IMAGES_DIR: /opt/images

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake autoconf automake \
            libtool libtool-bin pkg-config flex bison gawk gperf \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libltdl-dev python3 python3-docutils gettext autopoint texinfo \
            help2man unzip xxd cpio wget curl git shellcheck p7zip-full \
            fakeroot kmod file ca-certificates

      - name: Download toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          cd ..

      - name: Verify toolchain
        run: |
          ls -la toolchain-mipsel/toolchain-mipsel/bin/ | head -10
          toolchain-mipsel/toolchain-mipsel/bin/mipsel-linux-uclibc-gcc --version || true

      - name: Build firmware
        run: |
          cd trunk
          mkdir -p ${{ env.IMAGES_DIR }}
          shopt -s nullglob

          kernel_ver="$(sed -n 's/^FIRMWARE_KERNEL_VER=\"\([^\"]*\)\"/\1/p' Makefile | head -n1)"
          [ -n "$kernel_ver" ] || kernel_ver="unknown"
          git_version="$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"

          collect_image() {
            local model="$1"
            local image
            local dst

            for image in images/*.trx; do
              dst="${{ env.IMAGES_DIR }}/Padavan-${model}-${kernel_ver}.trx"
              cp -f "$image" "$dst"
              echo "Collected $image -> $dst"
            done
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_mode }}" = "single-target" ]; then
            # Single target build
            target="${{ github.event.inputs.target }}"
            echo "Building single target: $target"
            fakeroot ./build_firmware_modify $target
            if [ $? -eq 0 ]; then
              collect_image "$target"
              echo "artifact_name=Padavan-${target}-${kernel_ver}" >> $GITHUB_ENV
            fi
          else
            # Multi-target build based on variant
            variant="${{ github.event.inputs.variant || 'mt7621' }}"
            case $variant in
              mt7620)
                targets="PSG1208 PSG1218 NEWIFI-MINI MI-MINI"
                ;;
              mt7628)
                targets="HC5861B MI-NANO MZ-R13 MZ-R13P 360P2"
                ;;
              mt7621)
                targets="K2P_nano K2P DIR-878 RM2100 CR660x"
                ;;
              mt7621-usb)
                targets="XY-C1 JCG-836PRO JCG-AC860M MI-R3G NEWIFI3 B70"
                ;;
              *)
                targets="PSG1218"
                ;;
            esac

            echo "Building targets: $targets"
            for m in $targets; do
              echo "=== Building $m ==="
              fakeroot ./build_firmware_ci $m
              if [ $? -eq 0 ]; then
                collect_image "$m"
              else
                echo "Build failed for $m"
              fi
              ./clear_tree_simple >/dev/null 2>&1 || true
            done
            echo "artifact_name=Padavan-${variant}-${kernel_ver}-${git_version}" >> $GITHUB_ENV
          fi

      - name: List built images
        run: |
          ls -lh ${{ env.IMAGES_DIR }}/ || echo "No images built"
          echo "=== Image sizes ==="
          du -h ${{ env.IMAGES_DIR }}/*.trx 2>/dev/null || true

      - name: Generate checksums
        if: success()
        run: |
          if ls ${{ env.IMAGES_DIR }}/*.trx 1> /dev/null 2>&1; then
            cd ${{ env.IMAGES_DIR }}
            md5sum *.trx | tee md5sum.txt
          else
            echo "No firmware images to archive"
          fi

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name || 'firmware' }}
          path: |
            ${{ env.IMAGES_DIR }}/*.trx
            ${{ env.IMAGES_DIR }}/md5sum.txt
          retention-days: 30

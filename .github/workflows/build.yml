# This file is generated by .github/scripts/firmware_targets.py
# Do not edit it directly; update the target catalog generator instead.
name: Build Firmware

concurrency:
  group: build-firmware-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.inputs.target || 'smoke' }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target model'
        required: true
        default: 'RM2100'
        type: choice
        options:
          - ALL
          - 360P2
          - 5K-W20
          - A3004NS
          - B70
          - CR660x
          - DIR-878
          - DIR-882
          - E8820V2
          - HC5661A
          - HC5761A
          - HC5861B
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q20
          - JCG-Y2
          - K2P-USB
          - K2P
          - K2P_nano
          - MI-3
          - MI-3C
          - MI-4
          - MI-MINI
          - MI-NANO
          - MI-R3G
          - MI-R3P-breed
          - MI-R3P
          - MI-R4A
          - MR2600
          - MSG1500
          - MZ-R13
          - MZ-R13P
          - NETGEAR-BZV
          - NETGEAR-CHJ
          - NEWIFI-MINI
          - NEWIFI3
          - OYE-001
          - PSG1208
          - PSG1218
          - PSG1218_nano
          - R2100
          - R6220
          - RM2100
          - RT-AC1200GU
          - WDR7300
          - WR1200JS
          - XY-C1
          - ZTE_E8820S
      plugins:
        description: 'Optional plugins, comma-separated aliases; leave empty for defaults (e.g. smartdns,ttyd,wireguard)'
        required: false
        default: ''
        type: string

env:
  IMAGES_DIR: /opt/images

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify generated files
        run: |
          python3 .github/scripts/firmware_targets.py check-sync

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake autoconf automake \
            libtool libtool-bin pkg-config flex bison gawk gperf \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libltdl-dev python3 python3-docutils gettext autopoint texinfo \
            help2man unzip xxd cpio wget curl git fakeroot kmod file \
            ca-certificates

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v5
        with:
          path: toolchain-mipsel/toolchain-3.4.x
          key: ${{ runner.os }}-padavan-toolchain-3.4.x-${{ hashFiles('toolchain-mipsel/dl_toolchain.sh') }}

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          cd ..

      - name: Verify toolchain
        run: |
          ls -la toolchain-mipsel/toolchain-3.4.x/bin/ | head -10
          toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc --version || true

      - name: Build firmware
        id: build
        shell: bash
        env:
          WORKFLOW_PLUGINS: ${{ github.event.inputs.plugins || '' }}
        run: |
          set -euo pipefail

          cd trunk
          mkdir -p "${{ env.IMAGES_DIR }}"
          shopt -s nullglob

          catalog_script="${{ github.workspace }}/.github/scripts/firmware_targets.py"
          kernel_ver="$(sed -n 's/^FIRMWARE_KERNEL_VER=\"\([^\"]*\)\"/\1/p' Makefile | head -n1)"
          [ -n "$kernel_ver" ] || kernel_ver="unknown"
          git_version="$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"
          plugin_selection="${WORKFLOW_PLUGINS:-}"

          set_output() {
            local key="$1"
            local value="$2"
            echo "${key}=${value}" >> "$GITHUB_ENV"
            echo "${key}=${value}" >> "$GITHUB_OUTPUT"
          }

          if [ -n "$plugin_selection" ]; then
            export FIRMWARE_PLUGIN_RESET_LIST="$(python3 "$catalog_script" list-plugin-configs)"
            if ! FIRMWARE_PLUGIN_ENABLE_LIST="$(python3 "$catalog_script" resolve-plugins --plugins "$plugin_selection")"; then
              echo "::error::Invalid plugins input: $plugin_selection"
              {
                echo "## Supported plugin aliases"
                python3 "$catalog_script" list-plugin-aliases | tr ' ' '\n'
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            export FIRMWARE_PLUGIN_ENABLE_LIST
            echo "Applying optional plugin override: $plugin_selection"
            echo "Resolved plugin configs: $FIRMWARE_PLUGIN_ENABLE_LIST"
          else
            unset FIRMWARE_PLUGIN_RESET_LIST FIRMWARE_PLUGIN_ENABLE_LIST
          fi

          set_output "KERNEL_VER" "$kernel_ver"
          set_output "GIT_VERSION" "$git_version"
          set_output "kernel_ver" "$kernel_ver"
          set_output "git_version" "$git_version"

          collect_image() {
            local model="$1"
            local image
            local dst

            for image in images/*.trx; do
              dst="${{ env.IMAGES_DIR }}/Padavan-${model}-${kernel_ver}.trx"
              cp -f "$image" "$dst"
              echo "Collected $image -> $dst"
            done
          }

          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            target="RM2100"
            echo "Building smoke target for ${{ github.event_name }}: $target"
            fakeroot ./build_firmware_modify "$target"
            collect_image "$target"
            set_output "BUILD_MODE" "smoke-target"
            set_output "BUILD_VARIANT" ""
            set_output "build_mode" "smoke-target"
            set_output "build_variant" ""
            set_output "artifact_name" "Padavan-${target}-${kernel_ver}"
          else
            target="${{ github.event.inputs.target }}"
            if [ "$target" = "ALL" ]; then
              targets="$(python3 "$catalog_script" list-all-targets)"
              if [ -z "$targets" ]; then
                echo "No firmware targets defined" >&2
                exit 1
              fi

              echo "Building all targets: $targets"
              for model in $targets; do
                echo "=== Building $model ==="
                fakeroot ./build_firmware_ci "$model"
                collect_image "$model"
                ./clear_tree_simple >/dev/null 2>&1 || true
              done

              set_output "BUILD_MODE" "all-targets"
              set_output "BUILD_VARIANT" ""
              set_output "build_mode" "all-targets"
              set_output "build_variant" ""
              set_output "artifact_name" "Padavan-ALL-${kernel_ver}-${git_version}"
            else
              echo "Building single target: $target"
              fakeroot ./build_firmware_modify "$target"
              collect_image "$target"
              set_output "BUILD_MODE" "single-target"
              set_output "BUILD_VARIANT" ""
              set_output "build_mode" "single-target"
              set_output "build_variant" ""
              set_output "artifact_name" "Padavan-${target}-${kernel_ver}"
            fi
          fi

      - name: List built images
        run: |
          ls -lh "${{ env.IMAGES_DIR }}/" || echo "No images built"
          echo "=== Image sizes ==="
          du -h "${{ env.IMAGES_DIR }}"/*.trx 2>/dev/null || true

      - name: Generate checksums and manifest
        if: success()
        env:
          BUILD_MODE: ${{ steps.build.outputs.build_mode }}
          BUILD_VARIANT: ${{ steps.build.outputs.build_variant }}
          GIT_VERSION: ${{ steps.build.outputs.git_version }}
          KERNEL_VER: ${{ steps.build.outputs.kernel_ver }}
        run: |
          set -euo pipefail

          if ls "${{ env.IMAGES_DIR }}"/*.trx 1> /dev/null 2>&1; then
            cd "${{ env.IMAGES_DIR }}"
            md5sum *.trx | tee md5sum.txt

            python3 "${{ github.workspace }}/.github/scripts/firmware_targets.py" write-manifest \
              --images-dir "${{ env.IMAGES_DIR }}" \
              --build-mode "${{ env.BUILD_MODE }}" \
              --build-variant "${{ env.BUILD_VARIANT }}" \
              --kernel-version "${{ env.KERNEL_VER }}" \
              --git-revision "${{ env.GIT_VERSION }}"
          else
            echo "No firmware images to archive"
          fi

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build.outputs.artifact_name || 'firmware' }}
          path: |
            ${{ env.IMAGES_DIR }}/*.trx
            ${{ env.IMAGES_DIR }}/md5sum.txt
            ${{ env.IMAGES_DIR }}/manifest.json
          retention-days: 30

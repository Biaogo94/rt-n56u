# This file is generated by .github/scripts/firmware_targets.py
# Do not edit it directly; update the target catalog generator instead.
name: Build Firmware

concurrency:
  group: build-firmware-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}-${{ github.event.inputs.build_mode || 'auto' }}-${{ github.event.inputs.target || github.event.inputs.variant || 'default' }}
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
      - performance-optimization
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Manual build mode'
        required: true
        default: 'single-target'
        type: choice
        options:
          - single-target
          - variant-batch
      target:
        description: 'Build target model'
        required: true
        default: 'PSG1218'
        type: choice
        options:
          - 360P2
          - 5K-W20
          - A3004NS
          - B70
          - CR660x
          - DIR-878
          - DIR-882
          - E8820V2
          - HC5661A
          - HC5761A
          - HC5861B
          - JCG-836PRO
          - JCG-AC860M
          - JCG-Q20
          - JCG-Y2
          - K2P-USB
          - K2P
          - K2P_nano
          - MI-3
          - MI-3C
          - MI-4
          - MI-MINI
          - MI-NANO
          - MI-R3G
          - MI-R3P-breed
          - MI-R3P
          - MI-R4A
          - MR2600
          - MSG1500
          - MZ-R13
          - MZ-R13P
          - NETGEAR-BZV
          - NETGEAR-CHJ
          - NEWIFI-MINI
          - NEWIFI3
          - OYE-001
          - PSG1208
          - PSG1218
          - PSG1218_nano
          - R2100
          - R6220
          - RM2100
          - RT-AC1200GU
          - WDR7300
          - WR1200JS
          - XY-C1
          - ZTE_E8820S
      variant:
        description: 'Batch build variant'
        required: true
        default: 'mt7621'
        type: choice
        options:
          - mt7620
          - mt7628
          - mt7621
          - mt7621-usb

env:
  IMAGES_DIR: /opt/images

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify generated files
        run: |
          python3 .github/scripts/firmware_targets.py check-sync

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make cmake autoconf automake \
            libtool libtool-bin pkg-config flex bison gawk gperf \
            zlib1g-dev libgmp3-dev libmpc-dev libmpfr-dev libncurses5-dev \
            libltdl-dev python3 python3-docutils gettext autopoint texinfo \
            help2man unzip xxd cpio wget curl git fakeroot kmod file \
            ca-certificates

      - name: Restore toolchain cache
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: toolchain-mipsel/toolchain-3.4.x
          key: ${{ runner.os }}-padavan-toolchain-3.4.x-${{ hashFiles('toolchain-mipsel/dl_toolchain.sh') }}

      - name: Download toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh
          cd ..

      - name: Verify toolchain
        run: |
          ls -la toolchain-mipsel/toolchain-3.4.x/bin/ | head -10
          toolchain-mipsel/toolchain-3.4.x/bin/mipsel-linux-uclibc-gcc --version || true

      - name: Build firmware
        shell: bash
        run: |
          set -euo pipefail

          cd trunk
          mkdir -p "${{ env.IMAGES_DIR }}"
          shopt -s nullglob

          catalog_script="${{ github.workspace }}/.github/scripts/firmware_targets.py"
          kernel_ver="$(sed -n 's/^FIRMWARE_KERNEL_VER=\"\([^\"]*\)\"/\1/p' Makefile | head -n1)"
          [ -n "$kernel_ver" ] || kernel_ver="unknown"
          git_version="$(git rev-parse --short=7 HEAD 2>/dev/null || echo unknown)"

          echo "KERNEL_VER=$kernel_ver" >> "$GITHUB_ENV"
          echo "GIT_VERSION=$git_version" >> "$GITHUB_ENV"

          collect_image() {
            local model="$1"
            local image
            local dst

            for image in images/*.trx; do
              dst="${{ env.IMAGES_DIR }}/Padavan-${model}-${kernel_ver}.trx"
              cp -f "$image" "$dst"
              echo "Collected $image -> $dst"
            done
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.build_mode }}" = "single-target" ]; then
            target="${{ github.event.inputs.target }}"
            echo "Building single target: $target"
            fakeroot ./build_firmware_modify "$target"
            collect_image "$target"
            echo "BUILD_MODE=single-target" >> "$GITHUB_ENV"
            echo "BUILD_VARIANT=" >> "$GITHUB_ENV"
            echo "artifact_name=Padavan-${target}-${kernel_ver}" >> "$GITHUB_ENV"
          else
            variant="${{ github.event.inputs.variant || 'mt7621' }}"
            targets="$(python3 "$catalog_script" list-group "$variant")"
            if [ -z "$targets" ]; then
              echo "No targets defined for variant: $variant" >&2
              exit 1
            fi

            echo "Building targets: $targets"
            for model in $targets; do
              echo "=== Building $model ==="
              fakeroot ./build_firmware_ci "$model"
              collect_image "$model"
              ./clear_tree_simple >/dev/null 2>&1 || true
            done

            echo "BUILD_MODE=variant-batch" >> "$GITHUB_ENV"
            echo "BUILD_VARIANT=${variant}" >> "$GITHUB_ENV"
            echo "artifact_name=Padavan-${variant}-${kernel_ver}-${git_version}" >> "$GITHUB_ENV"
          fi

      - name: List built images
        run: |
          ls -lh "${{ env.IMAGES_DIR }}/" || echo "No images built"
          echo "=== Image sizes ==="
          du -h "${{ env.IMAGES_DIR }}"/*.trx 2>/dev/null || true

      - name: Generate checksums and manifest
        if: success()
        env:
          BUILD_MODE: ${{ env.BUILD_MODE }}
          BUILD_VARIANT: ${{ env.BUILD_VARIANT }}
          GIT_VERSION: ${{ env.GIT_VERSION }}
          KERNEL_VER: ${{ env.KERNEL_VER }}
        run: |
          set -euo pipefail

          if ls "${{ env.IMAGES_DIR }}"/*.trx 1> /dev/null 2>&1; then
            cd "${{ env.IMAGES_DIR }}"
            md5sum *.trx | tee md5sum.txt

            python3 - "${{ github.workspace }}/.github/firmware-targets.json" "${{ env.IMAGES_DIR }}" <<'PY'
            import json
            import os
            import sys
            from pathlib import Path

            catalog_path = Path(sys.argv[1])
            images_dir = Path(sys.argv[2])
            catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
            targets = {item["target"]: item for item in catalog["targets"]}

            images = []
            for image_path in sorted(images_dir.glob("Padavan-*.trx")):
                parts = image_path.stem.split("-")
                if len(parts) < 3 or parts[0] != "Padavan":
                    continue
                target = "-".join(parts[1:-1])
                meta = dict(targets[target])
                meta["filename"] = image_path.name
                meta["kernel_version"] = os.environ["KERNEL_VER"]
                meta["git_revision"] = os.environ["GIT_VERSION"]
                images.append(meta)

            manifest = {
                "build_mode": os.environ["BUILD_MODE"],
                "build_variant": os.environ["BUILD_VARIANT"],
                "kernel_version": os.environ["KERNEL_VER"],
                "git_revision": os.environ["GIT_VERSION"],
                "images": images,
            }

            (images_dir / "manifest.json").write_text(
                json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
                encoding="utf-8",
            )
            PY
          else
            echo "No firmware images to archive"
          fi

      - name: Upload firmware artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_name || 'firmware' }}
          path: |
            ${{ env.IMAGES_DIR }}/*.trx
            ${{ env.IMAGES_DIR }}/md5sum.txt
            ${{ env.IMAGES_DIR }}/manifest.json
          retention-days: 30
